# Evolution 配置文件
# 版本：4.1.6（2026-09-11）

# 分页参数
pagination:
  target_chunk_tokens: 90000    # 90K 目标（v3.4.0 考虑 CJK 系数修正后）
  max_chunk_tokens: 200000      # 200K 硬上限
  min_chunk_tokens: 40000       # 40K 最小值

# Token 估算参数
token_estimation:
  cjk_chars_per_token: 1.0      # 中文：1.0 字符/token（v3.4.0 修正）
  non_cjk_chars_per_token: 4.0  # 英文/代码：4 字符/token

# 同步引擎参数（M1 E6/E7）
sync_engine:
  estimate_safety_factor: 1.5   # token 估算安全因子：分页决策一律使用 est × factor（对抗 1.3~2 倍系统性低估）
  max_chunk_chars: 800000       # 字符数硬守卫 = max_chunk_tokens × 4（估算器彻底失效时的兜底上限）
  max_batch_retries: 3          # 批次重生成上限，超限 failed(retry-exhausted)
  max_analysis_failures: 3      # 批次分析失败上限，超限 failed(analysis-exhausted)（F-3/N-4）
  keep_committed_batches: 20    # committed 批次审计保留数，更早的修剪（游标在 files 中不受影响）

# 窗口分配
window_allocation:
  instruction_tokens: 8000      # 分析指令 ~8K
  kb_read_tokens: 10000         # 知识库读取 ~10K
  kb_write_tokens: 10000        # 知识库写入 ~10K
  output_tokens: 20000          # 输出空间 ~20K
  overhead_tokens: 50000        # 模型内部开销 ~50K
  safety_margin: 812000         # 安全余量 ~812K
  usage_rate: 0.19              # 实际使用率 ~19%

# 状态标记（V3 三级：[D]/[V]/[X]）
status_markers:
  draft: "[D]"
  verified: "[V]"
  deprecated: "[X]"

# 知识库位置
knowledge_base:
  location: "evolution/knowledge-base/"

# 导出机制
export:
  method: "evolution-export.py（唯一方式）"
  modes:
    full: "全量导出当前项目的全部历史对话（流式两遍扫描 + k-way 归并，O(1) 内存）"
    incremental: "增量导出当前项目的新增对话（delta 全局时间排序）"
